<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>Restablecer contraseña</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #F0F2F5;
            font-family: 'Inter', Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .wrapper {
            width: 100%;
            padding: 48px 16px;
        }

        .container {
            max-width: 540px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 8px;
        }

        /* Card */
        .card {
            background-color: #FFFFFF;
            border-radius: 16px;
            padding: 48px 44px;
            margin-top: 28px;
            border: 1px solid #E4E7EC;
        }

        /* Indicator line */
        .indicator {
            width: 40px;
            height: 4px;
            background-color: #7C3AED;
            border-radius: 2px;
            margin-bottom: 32px;
        }

        .title {
            font-size: 24px;
            font-weight: 600;
            color: #1E2A3B;
            letter-spacing: -0.4px;
            line-height: 1.3;
            margin-bottom: 14px;
        }

        .description {
            font-size: 15px;
            color: #5A6478;
            line-height: 1.65;
            margin-bottom: 32px;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #1E2A3B;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            font-size: 14px;
            font-family: 'Inter', Arial, sans-serif;
            color: #1E2A3B;
            background-color: #FFFFFF;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:focus {
            border-color: #7C3AED;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
        }

        .form-input::placeholder {
            color: #A0A8B4;
        }

        .btn-wrapper {
            margin-top: 28px;
            margin-bottom: 4px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            background-color: #7C3AED;
            color: #FFFFFF;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            font-family: 'Inter', Arial, sans-serif;
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            letter-spacing: 0.1px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #6D28D9;
        }


        @media (max-width: 480px) {
            .card {
                padding: 36px 28px;
            }

            .title {
                font-size: 21px;
            }
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="container">

        <!-- Card -->
        <div class="card">
            <div class="indicator"></div>

            <h1 class="title">Restablecer contraseña</h1>

            <p class="description">Ingresa tu nueva contraseña para recuperar el acceso a tu cuenta.</p>

            <div th:if="${error}" class="error-message" style="background-color:#FEF2F2; border:1px solid #FECACA; border-radius:8px; padding:12px 16px; margin-bottom:24px; color:#991B1B; font-size:14px; line-height:1.5;" th:text="${error}"></div>

            <form th:action="@{/recovery/reset-password}" method="post">
                <input type="hidden" name="token" th:value="${token}"/>
                <div class="form-group">
                    <label class="form-label" for="newPassword">Nueva contraseña</label>
                    <input class="form-input" type="password" id="newPassword" name="newPassword"
                           placeholder="Ingresa tu nueva contraseña" required/>
                </div>

                <div class="form-group">
                    <label class="form-label" for="repeatPassword">Repetir contraseña</label>
                    <input class="form-input" type="password" id="repeatPassword" name="repeatPassword"
                           placeholder="Repite tu nueva contraseña" required/>
                </div>

                <div class="btn-wrapper">
                    <button type="submit" class="btn">Enviar</button>
                </div>
            </form>
        </div>

    </div>
</div>
</body>
</html>
