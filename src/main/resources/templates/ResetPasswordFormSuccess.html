<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>Contraseña actualizada</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #F0F2F5;
            font-family: 'Inter', Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .wrapper {
            width: 100%;
            padding: 48px 16px;
        }

        .container {
            max-width: 540px;
            margin: 0 auto;
        }

        .card {
            background-color: #FFFFFF;
            border-radius: 16px;
            padding: 48px 44px;
            margin-top: 28px;
            border: 1px solid #E4E7EC;
            text-align: center;
        }

        .indicator {
            width: 40px;
            height: 4px;
            background-color: #10B981;
            border-radius: 2px;
            margin: 0 auto 32px auto;
        }

        .icon {
            width: 56px;
            height: 56px;
            background-color: #ECFDF5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px auto;
        }

        .title {
            font-size: 24px;
            font-weight: 600;
            color: #1E2A3B;
            letter-spacing: -0.4px;
            line-height: 1.3;
            margin-bottom: 14px;
        }

        .description {
            font-size: 15px;
            color: #5A6478;
            line-height: 1.65;
            margin-bottom: 32px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            background-color: #1A56DB;
            color: #FFFFFF;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            font-family: 'Inter', Arial, sans-serif;
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            letter-spacing: 0.1px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #1648B8;
        }

        @media (max-width: 480px) {
            .card {
                padding: 36px 28px;
            }

            .title {
                font-size: 21px;
            }
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="container">

        <div class="card">
            <div class="indicator"></div>

            <div class="icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 6L9 17L4 12" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>

            <h1 class="title">Contraseña actualizada</h1>

            <p class="description" th:text="${successMessage}">Tu contraseña ha sido cambiada correctamente.</p>

            <a href="/auth/login" class="btn">Iniciar sesión</a>
        </div>

    </div>
</div>
</body>
</html>
